name: Promote DB Migrations to Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PROMOTE-TO-PRODUCTION to confirm'
        required: true

jobs:
  promote:
    runs-on: ubuntu-latest
    # Requires manual reviewer approval in the Actions UI, even for the
    # person who triggered the run — a second independent gate on top of
    # the typed confirmation phrase below.
    environment: production
    steps:
      - name: Verify confirmation phrase
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "PROMOTE-TO-PRODUCTION" ]; then
            echo "Confirmation phrase did not match. Aborting."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link production project
        run: supabase link --project-ref "$PROD_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROD_PROJECT_REF: ${{ secrets.PROD_PROJECT_REF }}
      - name: Preview pending migrations
        run: supabase db push --dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Push migrations to production
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
